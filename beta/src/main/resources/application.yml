spring:
  datasource:
    url: ${DB_URL_17}
    username: ${DB_USERNAME_17}
    password: ${DB_PASSWORD_17}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    schemas:
      - beta

  rabbitmq:
    host: ${GOOGLE_SERVER}
    port: 5672
    username: user
    password: password

rabbit:
  queueName: FirstQueue
  hostName: ${GOOGLE_SERVER}
  username: user
  password: password